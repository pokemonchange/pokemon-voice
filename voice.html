<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ポケモン音声入力</title>
</head>
<body>
  <h2>ポケモン音声入力</h2>
  <p id="status">音声入力を準備しています...</p>

  <button id="startButton" type="button" hidden>
    音声入力を開始
  </button>

  <script>
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    const status = document.getElementById('status');
    const startButton = document.getElementById('startButton');

    let recognition = null;
    let isRunning = false;
    let completed = false;

    // ==========================================
    // ポケモン名の誤認識を補正
    // ==========================================


function correctPokemonName(transcript) {
  let text = transcript.trim();

  // 前後の空白・句読点などを除去して照合しやすくする
  const normalized = text
    .replace(/[\s　、。,.!?！？・]/g, '')
    .replace(/ー{2,}/g, 'ー');

  // 短いポケモン名は、認識結果全体を照合して補正
  const exactCorrections = {
    // ヌオー
    'ヌオー': 'ヌオー',
    'ヌオ': 'ヌオー',
    'ヌオウ': 'ヌオー',
    'ぬお': 'ヌオー',
    'ぬおー': 'ヌオー',
    'ぬおう': 'ヌオー',
    '沼王': 'ヌオー',

    // ドオー
    'ドオー': 'ドオー',
    'ドオ': 'ドオー',
    'ドーオ': 'ドオー',
    'ドオウ': 'ドオー',
    'どお': 'ドオー',
    'どおー': 'ドオー',
    'どおう': 'ドオー',
    '土王': 'ドオー',

    // ウッウ
    'ウッウ': 'ウッウ',
    'ウウ': 'ウッウ',
    'ウッ': 'ウッウ',
    'うっう': 'ウッウ',
    'うう': 'ウッウ',
    'うっ': 'ウッウ'
  };

  if (exactCorrections[normalized]) {
    return exactCorrections[normalized];
  }

  // 文章中に現れた場合の補正
  const corrections = [
    // ヌオー
    [/沼王/g, 'ヌオー'],
    [/ぬお+[ーう]*/g, 'ヌオー'],
    [/ヌオ+[ーう]*/g, 'ヌオー'],

    // ドオー
    [/土王/g, 'ドオー'],
    [/どお+[ーう]*/g, 'ドオー'],
    [/ドー?オ+[ーう]*/g, 'ドオー'],

    // ウッウ
    [/ウッウ+/g, 'ウッウ'],
    [/うっう+/g, 'ウッウ']
  ];

  corrections.forEach(([pattern, replacement]) => {
    text = text.replace(pattern, replacement);
  });

  // 長音の連続を1つにまとめる
  text = text.replace(/ー{2,}/g, 'ー');

  return text;
}


    // ==========================================
    // 音声認識を開始
    // ==========================================

    function startRecognition() {
      if (!SpeechRecognition) {
        status.textContent =
          'このブラウザは音声認識に対応していません。';

        startButton.hidden = false;
        return;
      }

      if (isRunning || completed) return;

      recognition = new SpeechRecognition();

      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.continuous = false;

      isRunning = true;
      startButton.hidden = true;
      status.textContent = 'ポケモン名を話してください...';

      // ==========================================
      // 認識結果を受け取る
      // ==========================================

      recognition.onresult = function (event) {
        const originalTranscript =
          event.results[0][0].transcript.trim();

        // 誤認識を補正
        const transcript =
          correctPokemonName(originalTranscript);

        completed = true;

        status.textContent =
          '認識結果：' + transcript;

        // GAS側の画面に認識結果を返す
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(
            {
              type: 'POKEMON_VOICE_RESULT',
              transcript: transcript
            },
            '*'
          );

          status.textContent =
            '入力結果を元の画面に送信しました。';

          setTimeout(() => window.close(), 500);

        } else {
          status.textContent +=
            '。元の画面に戻って確認してください。';

          startButton.hidden = false;
        }
      };

      // ==========================================
      // エラー処理
      // ==========================================

      recognition.onerror = function (event) {
        isRunning = false;

        status.textContent =
          '自動開始できませんでした（' +
          event.error +
          '）。下のボタンを押してください。';

        startButton.hidden = false;
      };

      // ==========================================
      // 音声認識終了時
      // ==========================================

      recognition.onend = function () {
        isRunning = false;

        if (!completed) {
          startButton.hidden = false;

          if (status.textContent.includes('話してください')) {
            status.textContent =
              '音声認識に失敗しました。もう一度開始できます。';
          }
        }
      };

      // ==========================================
      // 認識開始
      // ==========================================

      try {
        recognition.start();

      } catch (error) {
        isRunning = false;

        status.textContent =
          '自動開始できませんでした。下のボタンを押してください。';

        startButton.hidden = false;
      }
    }

    // ボタンから音声認識を開始
    startButton.addEventListener(
      'click',
      startRecognition
    );

    // ==========================================
    // ページを開いたら自動で音声認識を開始
    // ==========================================

    window.addEventListener('load', function () {
      startRecognition();
    });
  </script>
</body>
</html>
